```yaml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows executable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)

          dotnet publish SystrayShortcuts/SystrayShortcuts.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output artifacts/release `
            -p:Version="$version" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts/release/SystrayShortcuts.exe#SystrayShortcuts.exe" `
            --verify-tag `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes